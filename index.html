<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            flex: 1;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 28px;
            color: #2980b9;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            margin-top: 15px;
        }

        .add-btn {
            background: #27ae60;
        }

        .update-btn {
            background: #f39c12;
        }

        .cancel-btn {
            background: #7f8c8d;
            margin-left: 8px;
        }

        .search-box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .search-box input {
            width: 100%;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #34495e;
            color: white;
        }

        .edit-btn {
            background: #3498db;
            margin: 0 3px;
        }

        .delete-btn {
            background: #e74c3c;
            margin: 0 3px;
        }

        .status-available {
            color: #27ae60;
            font-weight: bold;
        }

        .status-borrowed {
            color: #e74c3c;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            padding: 15px;
            text-align: center;
            background: #2c3e50;
            color: white;
        }

        @media (max-width: 700px) {
            .cards {
                flex-direction: column;
            }

            .form-group {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Library Management System</h1>
    <p>Book Management - CRUD Application</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="cards">

        <div class="card">
            <h2 id="totalBooks">0</h2>
            <p>Total Books</p>
        </div>

        <div class="card">
            <h2 id="availableBooks">0</h2>
            <p>Available Books</p>
        </div>

        <div class="card">
            <h2 id="borrowedBooks">0</h2>
            <p>Borrowed Books</p>
        </div>

    </div>


    <!-- Add / Edit Book Form -->
    <div class="form-box">

        <h2 id="formTitle">Add New Book</h2>

        <div class="form-group">

            <input type="text" id="bookId" placeholder="Book ID">

            <input type="text" id="bookName" placeholder="Book Name">

            <input type="text" id="author" placeholder="Author Name">

            <input type="text" id="category" placeholder="Category">

            <input type="number" id="year" placeholder="Publication Year">

            <select id="status">
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
            </select>

        </div>

        <button class="add-btn" id="submitBtn" onclick="addBook()">
            Add Book
        </button>

        <button class="cancel-btn" id="cancelBtn"
                onclick="cancelEdit()" style="display:none;">
            Cancel
        </button>

    </div>


    <!-- Search -->
    <div class="search-box">

        <input type="text"
               id="search"
               placeholder="🔍 Search by Book ID, Name, Author or Category..."
               onkeyup="searchBooks()">

    </div>


    <!-- Book Table -->
    <div class="table-box">

        <h2>📖 Book List</h2>

        <table>

            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookTable">
            </tbody>

        </table>

    </div>

</div>


<footer>
    <p>Library Management System © 2026</p>
</footer>


<script>

    // Get books from Local Storage
    let books = JSON.parse(localStorage.getItem("libraryBooks")) || [];

    let editIndex = -1;


    // Add Book
    function addBook() {

        let id = document.getElementById("bookId").value.trim();
        let name = document.getElementById("bookName").value.trim();
        let author = document.getElementById("author").value.trim();
        let category = document.getElementById("category").value.trim();
        let year = document.getElementById("year").value;
        let status = document.getElementById("status").value;


        if (id === "" || name === "" || author === "" ||
            category === "" || year === "") {

            alert("Please fill all fields!");
            return;
        }


        // Check duplicate ID
        if (editIndex === -1 &&
            books.some(book => book.id === id)) {

            alert("Book ID already exists!");
            return;
        }


        let book = {
            id: id,
            name: name,
            author: author,
            category: category,
            year: year,
            status: status
        };


        if (editIndex === -1) {

            books.push(book);

            alert("Book added successfully!");

        } else {

            books[editIndex] = book;

            alert("Book updated successfully!");

            editIndex = -1;

            document.getElementById("formTitle").innerText =
                "Add New Book";

            document.getElementById("submitBtn").innerText =
                "Add Book";

            document.getElementById("submitBtn").className =
                "add-btn";

            document.getElementById("cancelBtn").style.display =
                "none";
        }


        saveBooks();

        clearForm();

        displayBooks();
    }


    // Display Books
    function displayBooks(bookList = books) {

        let table = document.getElementById("bookTable");

        table.innerHTML = "";


        if (bookList.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">No books found</td>
                </tr>
            `;

            updateDashboard();

            return;
        }


        bookList.forEach((book) => {

            let originalIndex = books.indexOf(book);

            let statusClass =
                book.status === "Available"
                ? "status-available"
                : "status-borrowed";


            table.innerHTML += `

                <tr>

                    <td>${book.id}</td>

                    <td>${book.name}</td>

                    <td>${book.author}</td>

                    <td>${book.category}</td>

                    <td>${book.year}</td>

                    <td class="${statusClass}">
                        ${book.status}
                    </td>

                    <td>

                        <button class="edit-btn"
                            onclick="editBook(${originalIndex})">
                            Edit
                        </button>

                        <button class="delete-btn"
                            onclick="deleteBook(${originalIndex})">
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        });


        updateDashboard();
    }


    // Edit Book
    function editBook(index) {

        let book = books[index];

        document.getElementById("bookId").value = book.id;

        document.getElementById("bookName").value = book.name;

        document.getElementById("author").value = book.author;

        document.getElementById("category").value = book.category;

        document.getElementById("year").value = book.year;

        document.getElementById("status").value = book.status;


        editIndex = index;


        document.getElementById("formTitle").innerText =
            "Edit Book";

        document.getElementById("submitBtn").innerText =
            "Update Book";

        document.getElementById("submitBtn").className =
            "update-btn";

        document.getElementById("cancelBtn").style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // Delete Book
    function deleteBook(index) {

        let confirmDelete =
            confirm("Are you sure you want to delete this book?");


        if (confirmDelete) {

            books.splice(index, 1);

            saveBooks();

            displayBooks();

            alert("Book deleted successfully!");
        }
    }


    // Search Books
    function searchBooks() {

        let searchValue =
            document.getElementById("search")
            .value
            .toLowerCase();


        let filteredBooks = books.filter(book =>

            book.id.toLowerCase().includes(searchValue) ||

            book.name.toLowerCase().includes(searchValue) ||

            book.author.toLowerCase().includes(searchValue) ||

            book.category.toLowerCase().includes(searchValue)

        );


        displayBooks(filteredBooks);
    }


    // Update Dashboard
    function updateDashboard() {

        let total = books.length;

        let available =
            books.filter(book =>
                book.status === "Available"
            ).length;

        let borrowed =
            books.filter(book =>
                book.status === "Borrowed"
            ).length;


        document.getElementById("totalBooks").innerText =
            total;

        document.getElementById("availableBooks").innerText =
            available;

        document.getElementById("borrowedBooks").innerText =
            borrowed;
    }


    // Clear Form
    function clearForm() {

        document.getElementById("bookId").value = "";

        document.getElementById("bookName").value = "";

        document.getElementById("author").value = "";

        document.getElementById("category").value = "";

        document.getElementById("year").value = "";

        document.getElementById("status").value = "Available";
    }


    // Cancel Edit
    function cancelEdit() {

        editIndex = -1;

        clearForm();

        document.getElementById("formTitle").innerText =
            "Add New Book";

        document.getElementById("submitBtn").innerText =
            "Add Book";

        document.getElementById("submitBtn").className =
            "add-btn";

        document.getElementById("cancelBtn").style.display =
            "none";
    }


    // Save to Local Storage
    function saveBooks() {

        localStorage.setItem(
            "libraryBooks",
            JSON.stringify(books)
        );
    }


    // Initial Display
    displayBooks();

</script>

</body>
</html>
